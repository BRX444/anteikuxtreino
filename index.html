<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <!-- ===== INÍCIO ===== -->
    <section id="inicio" class="hero">
      <svg class="tendrils" viewBox="0 0 600 700" aria-hidden="true">
        <defs>
          <linearGradient id="gT" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff3341"/><stop offset="1" stop-color="#5a0008" stop-opacity="0"/>

        </defs>
        <path class="t t1" d="M600 80 C 470 120, 430 250, 500 340 S 520 560, 380 690"/>

        <path class="t t4" d="M600 20 C 520 40, 380 90, 330 190 S 250 330, 150 360"/>
      </svg>

      <svg class="rosas" viewBox="0 0 500 700" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
        <defs>
          <symbol id="rosa" viewBox="-50 -50 100 100">
            <g class="p-ext">
              <path d="M0 0 C -24 -8 -32 -40 0 -46 C 32 -40 24 -8 0 0Z"/>

              <path d="M0 0 C -18 -6 -22 -30 0 -32 C 22 -30 18 -6 0 0Z" transform="rotate(306)"/>
            </g>
            <circle class="miolo" r="15"/>
            <path class="espiral" d="M1 -1 C 6 -5 9 3 3 7 C -5 11 -12 3 -8 -5 C -3 -14 10 -13 13 -4 C 16 6 8 15 -2 15"/>

        <g class="rosas-g">
          <path class="haste" style="--d:.1s" d="M40 700 C 70 600, 90 480, 150 400 S 190 300, 175 250"/>
          <path class="haste" style="--d:.35s" d="M120 700 C 160 640, 230 560, 260 500 S 300 440, 305 410"/>
          <path class="haste fina" style="--d:.6s" d="M0 650 C 40 610, 70 570, 85 515"/>

          <g transform="translate(118 452) rotate(-140)"><use href="#folha" class="folha" style="--d:1.1s"/></g>
          <g transform="translate(162 360) rotate(-20)"><use href="#folha" class="folha" style="--d:1.3s"/></g>

          <g transform="translate(55 600) rotate(-70)"><use href="#folha" class="folha pequena" style="--d:1.5s"/></g>

          <g transform="translate(175 245) scale(1.15)"><g class="flor" style="--d:1.7s"><use href="#rosa" x="-50" y="-50" width="100" height="100"/></g></g>
          <g transform="translate(305 405) scale(.9)"><g class="flor" style="--d:2s"><use href="#rosa" x="-50" y="-50" width="100" height="100"/></g></g>

        <g class="petalas">
          <g transform="translate(185 280)"><use href="#petala" class="petala" style="--d:4s;--t:9s;--x:70px"/></g>
          <g transform="translate(160 270)"><use href="#petala" class="petala" style="--d:7.5s;--t:11s;--x:-40px"/></g>

      <div class="hero-inner">
        <p class="kicker reveal"><span class="jp">喫茶 あんていく</span><span class="sep"></span>treinos competitivos</p>
        <h1 class="titulo reveal" data-text="ANTEIKU"><span>ANTEIKU</span></h1>
        <p class="subtitulo reveal">XTREINO</p>
        <p class="lead reveal">Organize seus xtreinos sem complicação. Monte, jogue e evolua junto com seu time.</p>

        <div class="hero-cta reveal">
          <a class="btn primario" href="chaveamento.html">Xtreino</a>
          <a class="btn fantasma" href="editar-times.html">Editar times</a>
        </div>

        <dl class="hero-stats reveal" id="heroStats"></dl>
      </div>
      <span class="scroll-hint" aria-hidden="true"><span></span></span>
    </section>

  </main>

  <script src="data/xtreino.js"></script>
  <script src="js/app.js"></script>

</html>
